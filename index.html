<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>模擬盤即時損益</title>
<style>
:root{--bg:#fcfcfb;--card:#ffffff;--ink:#0b0b0b;--ink2:#52514e;--muted:#8a8984;--line:#e4e3df;
--good:#0a7d0a;--bad:#c62f2f;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--warn:#fab219}
@media (prefers-color-scheme:dark){:root{--bg:#1a1a19;--card:#232322;--ink:#f0efec;--ink2:#c3c2b7;
--muted:#8f8e86;--line:#383835;--good:#3fbf3f;--bad:#ff6b6b;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,
"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:1040px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:28px 0 10px}
.sub{color:var(--ink2);font-size:13px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;
border:1px solid var(--line);margin-right:8px}
.banner{border:1px solid var(--bad);color:var(--bad);border-radius:10px;padding:10px 14px;margin:14px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .l{color:var(--ink2);font-size:12px}.kpi .v{font-size:22px;font-weight:650;margin-top:2px;
font-variant-numeric:tabular-nums}.kpi .d{font-size:13px;font-variant-numeric:tabular-nums}
.pos{color:var(--good)}.neg{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--ink2);font-weight:600;font-size:12px}
svg text{fill:var(--ink2);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--ink2);margin-top:6px}
.sw{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);
border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.12);display:none}
.foot{color:var(--muted);font-size:12px;margin-top:28px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:6px}
.stale .dot{background:var(--warn)}
</style>
</head>
<body>
<main>
<h1>模擬盤即時損益</h1>
<div class="sub" id="meta"></div>
<div id="banner"></div>

<h2>實際下單（OKX 模擬盤 · B 版 · 200 美元）</h2>
<div class="kpis" id="kpis"></div>

<h2>淨值走勢（期初 = 1，最後一點為即時）</h2>
<div class="card" style="position:relative">
  <div id="chart"></div><div class="legend" id="legend"></div><div class="tip" id="tip"></div>
</div>

<h2>目前持倉（即時價格）</h2>
<div class="card tw"><table id="positions"></table></div>

<h2>影子帳本（即時估值，主要評估依據）</h2>
<div class="sub">理論成交 = 真實市場中價 ± 滑價，加吃單手續費。「理想」不受最小下單量限制，以報酬率比較。</div>
<div class="card tw" style="margin-top:8px"><table id="shadow"></table></div>

<div class="foot">
  價格每 15 秒從 OKX 公開市場 API 更新，用「每天執行後的持倉 × 即時價格」估算，未計入下次結算前的資金費。
  部位只在每天 UTC 00:10（台灣 08:10）的執行時調整。研究與模擬用途，不構成投資建議。
</div>
</main>
<script id="data" type="application/json">{"generated_utc":null,"last_completed":null,"status":null,"asof_bar":null,"regime":{"hmm_probs":null,"C_high_vol":null},"live_version":"B","live":null,"shadow":{},"kill_switch":false}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const NAMES = {A:'A 基準', B:'B HMM', B2:'B2 HMM 確認', C:'C 波動規則'};
const fmtUsd = x => (x < 0 ? '-$' : '$') + Math.abs(x).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtPct = (x, d=2) => (x >= 0 ? '+' : '') + (x*100).toFixed(d) + '%';
const cls = x => x > 0 ? 'pos' : (x < 0 ? 'neg' : '');
const startOf = b => b.capital ? b.capital : 10000;
let PX = {}, lastPx = null;

function navLive(b){ let v = b.cash; for (const [i,q] of Object.entries(b.qty||{})) { if (!q) continue;
  const p = PX[i]; if (p == null) return null; v += q*p; } return v; }
function hist(b){ return (b.nav_history||[]).map(h => [h.date, h.nav]); }
function maxDD(vals){ let pk=-Infinity, m=0; for (const v of vals){ pk=Math.max(pk,v); m=Math.min(m, v/pk-1);} return m; }

async function fetchPrices(){
  const out = {};
  for (const t of ['SWAP','SPOT']) {
    const r = await fetch('https://www.okx.com/api/v5/market/tickers?instType=' + t);
    const j = await r.json();
    for (const d of j.data || []) { const b=+d.bidPx, a=+d.askPx; if (b>0 && a>0) out[d.instId]=(a+b)/2; }
  }
  return out;
}

function renderMeta(){
  const st = {ok:'✅ 正常', kill_switch:'🛑 觸發停損平倉', stopped_data:'⚠️ 資料異常停止', error:'❌ 錯誤'}[D.status] || '尚未執行';
  const probs = (D.regime && D.regime.hmm_probs) || {};
  let top = null; for (const k in probs) if (probs[k] != null && (top == null || probs[k] > probs[top])) top = k;
  const pxAge = lastPx ? Math.round((Date.now()-lastPx)/1000) : null;
  document.getElementById('meta').innerHTML =
    `<span class="badge">${st}</span>最後執行：${D.generated_utc ? new Date(D.generated_utc).toLocaleString('zh-TW') : '—'}` +
    ` · 市場狀態（HMM）：<b>${top || '—'}</b>${top ? '（' + Math.round(probs[top]*100) + '%）' : ''}` +
    ` · <span class="${pxAge!=null && pxAge<60 ? '' : 'stale'}"><span class="dot"></span>即時價格 ${pxAge==null ? '載入中' : pxAge + ' 秒前'}</span>`;
  document.getElementById('banner').innerHTML = D.kill_switch ?
    '<div class="banner">🛑 KILL_SWITCH 已觸發，程式停止交易。確認原因後需手動刪除 results/paper/KILL_SWITCH 才會恢復。</div>' : '';
}

function renderKpis(){
  const b = D.live, el = document.getElementById('kpis');
  if (!b) { el.innerHTML = '<div class="kpi"><div class="l">狀態</div><div class="v">尚未開始</div></div>'; return; }
  const start = startOf(b), h = hist(b), last = h.length ? h[h.length-1][1] : start;
  const now = navLive(b) ?? last;
  const vals = h.map(x=>x[1]).concat([now]);
  const kpi = (l, v, d, c='') => `<div class="kpi"><div class="l">${l}</div><div class="v ${c}">${v}</div><div class="d ${c}">${d}</div></div>`;
  el.innerHTML =
    kpi('即時淨值', fmtUsd(now), '起始 ' + fmtUsd(start)) +
    kpi('累積損益', fmtUsd(now-start), fmtPct(now/start-1), cls(now-start)) +
    kpi('自上次執行', fmtUsd(now-last), fmtPct(now/last-1), cls(now-last)) +
    kpi('最大回撤', fmtPct(maxDD(vals),1), '交易天數 ' + h.length) +
    kpi('累計手續費', fmtUsd(b.fees_paid||0), '資金費 ' + fmtUsd(b.funding_paid||0) + '（正=支出）');
}

function renderPositions(){
  const b = D.live, t = document.getElementById('positions');
  if (!b) { t.innerHTML = '<tr><td>尚未開始</td></tr>'; return; }
  const now = navLive(b) ?? startOf(b);
  const rows = Object.entries(b.qty||{}).filter(([,q])=>q).map(([i,q]) => {
    const p = PX[i]; const v = p!=null ? q*p : null; return {i,q,p,v}; })
    .sort((x,y)=>Math.abs(y.v||0)-Math.abs(x.v||0));
  t.innerHTML = '<tr><th>標的</th><th>方向</th><th>數量</th><th>即時價</th><th>價值</th><th>占淨值</th></tr>' +
    (rows.length ? rows.map(r => `<tr><td>${r.i}</td><td class="${r.q>0?'pos':'neg'}">${r.q>0?'多':'空'}</td>` +
      `<td>${Math.abs(r.q).toPrecision(4).replace(/\.?0+$/,'')}</td><td>${r.p!=null ? r.p.toLocaleString('en-US',{maximumFractionDigits:6}) : '—'}</td>` +
      `<td>${r.v!=null ? fmtUsd(r.v) : '—'}</td><td>${r.v!=null ? fmtPct(r.v/now,1) : '—'}</td></tr>`).join('')
     : '<tr><td colspan="6" style="text-align:left">目前沒有持倉</td></tr>');
}

function renderShadow(){
  const t = document.getElementById('shadow');
  const vo = {A:0, B:1, B2:2, C:3}, co = {'200':0, '2000':1, 'ideal':2};
  const keys = Object.keys(D.shadow||{}).sort((a,b) => { const [va,ca]=a.split('|'), [vb,cb]=b.split('|');
    return (vo[va]-vo[vb]) || (co[ca]-co[cb]); });
  t.innerHTML = '<tr><th>版本</th><th>資金</th><th>累積報酬（即時）</th><th>最大回撤</th><th>手續費</th><th>滑價</th><th>資金費</th><th>天數</th></tr>' +
    keys.map(k => { const b = D.shadow[k], [v,cap] = k.split('|'), s = startOf(b), h = hist(b);
      const now = navLive(b) ?? (h.length ? h[h.length-1][1] : s);
      const r = now/s-1, dd = maxDD(h.map(x=>x[1]).concat([now]));
      return `<tr><td>${NAMES[v]||v}</td><td>${cap==='ideal'?'理想':'$'+cap}</td><td class="${cls(r)}">${fmtPct(r)}</td>` +
        `<td>${fmtPct(dd,1)}</td><td>${((b.fees_paid||0)/s*100).toFixed(2)}%</td><td>${((b.slippage_paid||0)/s*100).toFixed(2)}%</td>` +
        `<td>${fmtPct((b.funding_paid||0)/s)}</td><td>${h.length}</td></tr>`; }).join('');
}

// live is listed last so it is drawn on top of a coinciding shadow line
const SERIES = [['B|ideal','影子 B 理想','--s2',false],['B|200','影子 B $200','--s3',true],
                ['B|2000','影子 B $2000','--s4',false],['live','實際下單 B $200','--s1',false]];
function renderChart(){
  const css = getComputedStyle(document.documentElement);
  const today = new Date().toISOString().slice(0,10);
  const lines = [];
  for (const [k, label, color, dashed] of SERIES) {
    const b = k === 'live' ? D.live : (D.shadow||{})[k]; if (!b) continue;
    const s = startOf(b), pts = hist(b).map(([d,v]) => [d, v/s]);
    const now = navLive(b); if (now != null) pts.push([today + ' 即時', now/s]);
    if (pts.length) lines.push({label, color: css.getPropertyValue(color).trim(), dashed, pts});
  }
  const el = document.getElementById('chart');
  if (!lines.length || Math.max(...lines.map(l=>l.pts.length)) < 2) { el.innerHTML = '<div class="sub" style="padding:24px 0">累積兩天以上的資料後會出現走勢圖。</div>'; document.getElementById('legend').innerHTML=''; return; }
  const W = el.clientWidth || 700, H = 260, L = 46, R = 12, T = 10, B = 26;
  const n = Math.max(...lines.map(l=>l.pts.length));
  const all = lines.flatMap(l=>l.pts.map(p=>p[1])); let lo = Math.min(...all, 1), hi = Math.max(...all, 1);
  const pad = (hi-lo)*0.08 || 0.01; lo -= pad; hi += pad;
  const x = i => L + (W-L-R) * (n<=1 ? 0 : i/(n-1)), y = v => T + (H-T-B) * (1-(v-lo)/(hi-lo));
  let g = '';
  for (let k=0;k<=4;k++){ const v = lo+(hi-lo)*k/4; g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${((v-1)*100).toFixed(1)}%</text>`; }
  g += `<line x1="${L}" x2="${W-R}" y1="${y(1)}" y2="${y(1)}" stroke="var(--ink2)" stroke-width="0.8"/>`;
  const ref = lines.reduce((a,b)=>a.pts.length>=b.pts.length?a:b).pts;
  [[0,'start'], [Math.floor((n-1)/2),'middle'], [n-1,'end']].forEach(([i,a]) => { if (ref[i]) g += `<text x="${x(i)}" y="${H-6}" text-anchor="${a}">${ref[i][0]}</text>`; });
  for (const l of lines) { const off = n - l.pts.length;
    g += `<path d="${l.pts.map((p,i)=>(i?'L':'M')+x(i+off).toFixed(1)+','+y(p[1]).toFixed(1)).join('')}" fill="none" stroke="${l.color}" stroke-width="${l.label.startsWith('實際')?2.4:1.8}" ${l.dashed?'stroke-dasharray="6 4"':''} stroke-linejoin="round"/>`; }
  g += `<line id="cross" y1="${T}" y2="${H-B}" stroke="var(--ink2)" stroke-width="0.6" visibility="hidden"/>`;
  el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="淨值走勢">${g}</svg>`;
  document.getElementById('legend').innerHTML = lines.slice().reverse().map(l => `<span><span class="sw" style="background:${l.color}"></span>${l.label} ${fmtPct(l.pts[l.pts.length-1][1]-1)}</span>`).join('');
  const svg = el.querySelector('svg'), tip = document.getElementById('tip'), cross = svg.querySelector('#cross');
  svg.onmousemove = e => { const r = svg.getBoundingClientRect(); const i = Math.round((e.clientX-r.left-L)/((W-L-R)/(n-1||1)));
    if (i<0||i>=n) return; cross.setAttribute('x1',x(i)); cross.setAttribute('x2',x(i)); cross.setAttribute('visibility','visible');
    tip.style.display='block'; tip.style.left=Math.min(x(i)+12, W-170)+'px'; tip.style.top='12px';
    tip.innerHTML = '<b>'+(ref[i]?ref[i][0]:'')+'</b><br>' + lines.map(l=>{const p=l.pts[i-(n-l.pts.length)]; return p?`${l.label}：${fmtPct(p[1]-1)}`:'';}).filter(Boolean).join('<br>'); };
  svg.onmouseleave = () => { tip.style.display='none'; cross.setAttribute('visibility','hidden'); };
}

function renderAll(){ renderMeta(); renderKpis(); renderPositions(); renderShadow(); renderChart(); }
async function tick(){ try { PX = await fetchPrices(); lastPx = Date.now(); } catch (e) { console.warn('price fetch failed', e); } renderAll(); }
renderAll(); tick(); setInterval(tick, 15000); setInterval(renderMeta, 1000);
window.addEventListener('resize', renderChart);
</script>
</body>
</html>
